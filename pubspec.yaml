name: contador
description: Contagem regressiva com widgets para a tela inicial e tela de bloqueio (Android e iOS).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"  # Flutter 3.27+

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Ponte entre o app Flutter e os widgets nativos (App Group no iOS,
  # SharedPreferences no Android).
  home_widget: ^0.9.0
  # A versão do intl é fixada pelo flutter_localizations.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
